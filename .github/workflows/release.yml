name: Release macOS arm64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect version
        id: detect
        run: |
          VERSION=$(python3 -c "import plistlib; print(plistlib.load(open('Info.plist','rb'))['CFBundleShortVersionString'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} already released, skipping"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is new, will release"
          fi

  build:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: macos-latest
    env:
      TOOLCHAINS: swift-5.10.1-RELEASE
      MACPLAYER_USE_SYSTEM_SWIFT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift 5.10.1 toolchain (system runtime, no bundling)
        run: |
          # v1.0.11: compile with swift.org Swift 5.10.1 instead of
          # Xcode's Swift 6.2. Swift 6.2 emits a reference to
          # _$ss20__StaticArrayStorageCN, a symbol the macOS 13 system
          # Swift 5.9 runtime lacks (v1.0.4 crash) — and no real arm64
          # Swift overlay exists on the runner to bundle instead
          # (run #37). Swift 5.10.1 emits only symbols already in the
          # 5.9 system runtime, so the app uses the system runtime
          # as-is and build.sh skips bundling (MACPLAYER_USE_SYSTEM_SWIFT=1).
          # Install it FIRST so libmpv (build-deps.sh) is also built
          # with 5.10.1. TOOLCHAINS + the PATH entry below make both
          # xcrun and plain swiftc resolve to 5.10.1.
          curl -LO https://download.swift.org/swift-5.10.1-release/xcode/swift-5.10.1-RELEASE/swift-5.10.1-RELEASE-osx.pkg
          sudo installer -pkg swift-5.10.1-RELEASE-osx.pkg -target /
          echo "/Library/Developer/Toolchains/swift-5.10.1-RELEASE.xctoolchain/usr/bin" >> "$GITHUB_PATH"
          echo "swiftc: $(which swiftc)"
          /Library/Developer/Toolchains/swift-5.10.1-RELEASE.xctoolchain/usr/bin/swiftc --version
          echo "xcrun swiftc: $(xcrun --find swiftc)"

      - name: Build LGPL deps (FFmpeg + libmpv)
        run: |
          chmod +x scripts/build-deps.sh build.sh
          ./scripts/build-deps.sh

      - name: Build MacPlayer.app
        run: ./build.sh

      - name: Verify arm64 app
        run: |
          test -d MacPlayer.app
          file MacPlayer.app/Contents/MacOS/MacPlayer
          lipo -info MacPlayer.app/Contents/MacOS/MacPlayer | grep -q arm64

      - name: Collect third-party licences
        run: |
          mkdir -p MacPlayer.app/Contents/Resources/LICENSES
          # Copy licence texts shipped with the built deps when present;
          # otherwise leave the README note that names the sources.
          for f in deps/share/doc/*/LICENSE deps/share/doc/*/COPYING deps/lib/pkgconfig/../../share/licenses/*; do
            [ -f "$f" ] && cp -f "$f" MacPlayer.app/Contents/Resources/LICENSES/ 2>/dev/null || true
          done
          cat > MacPlayer.app/Contents/Resources/LICENSES/README.txt <<'EOF'
          Third-party licences (LGPL)
          -----------------------------
          MacPlayer itself is MIT (see LICENSE in the repo).
          The bundled playback engine is built from:
            - libmpv  (LGPLv2.1+, built with meson -Dgpl=false)
              https://github.com/mpv-player/mpv
            - FFmpeg  (LGPLv2.1+, built with --disable-gpl)
              https://ffmpeg.org
            - libplacebo, libass, dav1d (see their own licence files)
          The engine ships as separate dynamic libraries in
          Contents/Frameworks/ with @rpath install names, so a compatible
          library can be swapped in (LGPL relinking). The build scripts
          in scripts/build-deps.sh reproduce the exact build.
          EOF
          ls -R MacPlayer.app/Contents/Resources/LICENSES

      - name: Make DMG
        run: |
          TAG="v${{ needs.version.outputs.version }}"
          rm -rf dmg-staging && mkdir dmg-staging
          cp -R MacPlayer.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname MacPlayer -srcfolder dmg-staging \
            -ov -format UDZO "MacPlayer-${TAG}-macos-arm64.dmg"
          ls -lh *.dmg

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: MacPlayer-*-macos-arm64.dmg
          generate_release_notes: true
          body: |
            MacPlayer — Apple Silicon arm64 only, unsigned.
            First open: right-click the app and choose Open, or
            System Settings → Privacy & Security → Open Anyway.
            See README.md for the unsigned-app workaround.

      - name: Delete older releases (keep only latest)
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ "$tag" != "$NEW_TAG" ]; then
              echo "Deleting old release $tag"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
